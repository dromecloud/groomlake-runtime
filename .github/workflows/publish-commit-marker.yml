name: Publish commit marker

# Runs scripts/publish.sh on every push to main, regardless of who or what
# pushed (human, Claude, Codex, another agent). This is the actual fix for
# the 2026-08-10 incident where a forgotten manual second commit left ATIS
# serving an inconsistent manifest_version/commit pair, and a real
# provisioning ticket failed before installing even motd. A local script
# still depends on someone remembering to run it; this does not.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-commit-marker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Configure git identity for the marker commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish and verify
        run: scripts/publish.sh
